<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Trabajo académico - Nicolás Bodnariuk</title>

<style>
/* === Consistencia con las otras pestañas (index/about/privatesector) === */
html {
  background: #0b1120 url('fondo_2.png') center top / cover no-repeat fixed;
  scrollbar-gutter: stable both-edges;
}
@supports not (scrollbar-gutter: stable) { html { overflow-y: scroll; } }

*, *::before, *::after { box-sizing: border-box; }
img { max-width: 100%; height: auto; display: block; }
html, body { height: 100%; }
body {
  min-height: 100vh;
  margin: 0;
  padding: 0;
  overflow-x: hidden;
  font-family: "Segoe UI", Roboto, Arial, sans-serif;
  color: #f2f2f2;
  background: transparent;
}

:root {
  --nav-h: 60px;
  --cian: #00E5FF;
  --orange: #FFB74D;
  --panel: rgba(15, 20, 35, 0.72);
}

/* ===== Barra de navegación ===== */
nav {
  height: var(--nav-h);
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 50px;
  width: 100%;
  background-color: rgba(10, 15, 25, 0.75);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid rgba(255, 255, 255, 0.15);
  position: sticky;
  top: 0;
  z-index: 1000;
  box-shadow: 0 4px 12px rgba(0, 0, 0, .4);
}
nav a {
  color: rgba(230, 230, 230, .9);
  text-decoration: none;
  font-weight: 600;
  font-size: 1.05rem;
  letter-spacing: .4px;
  padding-inline: 6px;
  transition: color .3s ease, text-shadow .3s ease;
}
nav a:hover { color: var(--cian); text-shadow: 0 0 8px rgba(0,229,255,.8); }
nav a[aria-current="page"] { color: #fff; text-shadow: 0 0 8px rgba(0,229,255,.55); }

/* ===== Selector de idioma (ya venía en tu HTML) ===== */
.lang-switch {
  display: flex;
  gap: 12px;
  font-size: 1.5rem;
  align-items: center;
}
.lang-switch a {
  text-decoration: none;
  cursor: pointer;
  transition: transform 0.2s ease;
}
.lang-switch a:hover {
  transform: scale(1.25);
}

/* ===== Título de página ===== */
h1 {
  text-align: center;
  color: var(--orange);
  text-shadow: 0 0 12px rgba(255,183,77,.85);
  margin: 40px 0 10px;
  font-size: 2.1rem;
}

/* ===== Contenedor principal ===== */
.content {
  max-width: 1100px;
  margin: 20px auto 60px;
  padding: 40px 50px;
  background: var(--panel);
  backdrop-filter: blur(4px);
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 15px;
  box-shadow: 0 6px 25px rgba(0,0,0,.45);
}
