<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Home - Nicolás Bodnariuk</title>
<link rel="stylesheet" href="style.css">

<style>
body {
  font-family: "Segoe UI", Roboto, Arial, sans-serif;
  margin: 0;
  padding: 0;
  background-image: url('fondo_2.png'); /* tu fondo */
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  color: #f2f2f2;
}

/* Semi-transparent container for readability */
.content {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 40px;
  background-color: rgba(15, 20, 35, 0.72); /* color oscuro con transparencia controlada */
  backdrop-filter: blur(4px); /* efecto sutil de difuminado */
  max-width: 900px;
  margin: 80px auto;
  border: 1px solid rgba(255, 255, 255, 0.15); /* borde suave */
  border-radius: 15px;
  box-shadow: 0 6px 25px rgba(0, 0, 0, 0.45);
}

/* Text section */
.content .text {
  flex: 1;
  margin-right: 20px;
  color: rgba(255, 255, 255, 0.92);
  text-shadow: 0 0 8px rgba(0, 0, 0, 0.5); /* leve contraste */
}

  color: rgba(79, 195, 247, 0.95); /* celeste azulado que resalta*
